spring.application.name=traceback
spring.profiles.default=local
server.address=127.0.0.1
server.port=8080
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
traceback.meta.key=${META_API_KEY:}
traceback.meta.model=${META_MODEL:muse-spark-1.3}
traceback.meta.provider=${META_PROVIDER:meta}
traceback.meta.endpoint=${META_ENDPOINT:https://api.meta.ai/v1/chat/completions}
traceback.ai.provider=${AI_PROVIDER:nvidia}
traceback.nvidia.key=${NVIDIA_API_KEY:}
traceback.nvidia.model=${NVIDIA_MODEL:meta/muse-glimmer-30b}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
traceback.projects.directory=${PROJECT_STORAGE:./data/projects}
traceback.projects.runner-image=${PROJECT_RUNNER_IMAGE:traceback-java-runner:17}
