# Use behind an HTTPS reverse proxy with persistent storage.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
traceback.demo.access-enabled=true
traceback.ai.provider=nvidia
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/traceback;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
