services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: traceback
      POSTGRES_USER: traceback
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - traceback-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceback -d traceback"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  traceback-data:
